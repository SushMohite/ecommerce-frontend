<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-Commerce</title>
    <link rel="stylesheet" href="styles/main.css" />
  </head>
  <body>
    <header class="header">
      <div class="container">
        <!-- Logo -->
        <div class="logo">ShopEase</div>

        <!-- Navigation -->
        <nav class="nav" id="nav-menu">
          <a href="#">Home</a>
          <a href="#products">Products</a>
          <a href="#">About</a>
          <a href="#">Contact</a>
        </nav>

        <nav>
          <button id="logoutBtn" style="display: none">Logout</button>
        </nav>

        <!-- Right Section -->
        <div class="header-right">
          <!-- Search Bar -->
          <div class="search-box">
            <input type="text" placeholder="Search products..." />
          </div>

          <!-- Login / Signup -->
          <a href="auth.html" class="auth-link" id="authLink">Login</a>
          <!-- Cart -->
          <a href="cart.html"> 🛒 <span id="cart-count">0</span> </a>

          <!-- Hamburger -->
          <div class="hamburger" id="hamburger">☰</div>
        </div>
      </div>
    </header>

    <!-- 🔥 HERO SECTION -->
    <section class="hero">
      <div class="hero-content">
        <h1>Biggest Sale of the Year</h1>
        <p>Up to 50% off on all products. Limited time offer!</p>
        <a href="#products" class="cta-btn">Shop Now</a>
      </div>
    </section>

    <section id="products" class="products-section">
      <h2>Our Products</h2>

      <div id="loading">Loading products...</div>
      <div id="error" style="display: none">Failed to load products.</div>

      <div class="product-grid" id="productGrid">
        <!-- Products will load here dynamically -->
      </div>
    </section>

    <script type="module" src="scripts/app.js"></script>
  </body>
</html>
